# Auf echtem Windows testen und bauen. Bei einem Tag vX.Y.Z: Installer als Release veröffentlichen –
# installierte Apps holen sich das Update automatisch (latest.yml).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sprachmodell laden
        run: npm run model
      - name: Tests
        run: npm test
      - name: Windows-Praxistest (Aktionen)
        run: node test/windows-smoke.js
      - name: App-Test (Electron, Sprachmodell, Erkenner)
        run: node test/electron-smoke.js
      - name: Installer bauen
        run: npx electron-builder --win nsis zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: CommandWave
          path: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
          retention-days: 14
      - name: Veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          test -f dist/latest.yml && test -f "dist/CommandWave-Setup-$V.exe"
          cp "dist/CommandWave-Setup-$V.exe" dist/CommandWave-Setup.exe
          gh release create "$GITHUB_REF_NAME" --title "CommandWave $V" --notes "Installer: CommandWave-Setup.exe herunterladen und starten. Installierte Versionen aktualisieren sich automatisch." \
            "dist/CommandWave-Setup-$V.exe" "dist/CommandWave-Setup-$V.exe.blockmap" dist/latest.yml dist/CommandWave-Setup.exe "dist/CommandWave-Setup-$V.zip"
